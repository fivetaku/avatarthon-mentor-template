name: 제출물 검사
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    if: github.repository != 'fivetaku/avatarthon-mentor-template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - name: 제출물 검사
        run: python3 scripts/check_submission.py .
